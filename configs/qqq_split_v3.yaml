schema_version: 3
study_id: qqq_split_v3
purpose: Fresh daily QQQ leverage-rotation rebuild with chronological selection and evaluation
prior_research_disclosure: >-
  The historical period was previously explored. Test observations are excluded
  from this parameter-selection procedure, but are not an untouched research holdout.
segments:
  development:
    start: '2002-01-01'
    end: '2011-12-31'
  validation:
    start: '2012-01-01'
    end: '2015-12-31'
  test:
    start: '2016-01-01'
    end: '2026-06-01'
source_contract:
  primary: Alpha Vantage QQQ daily raw closes, distributions and split coefficients
  completeness_check: Independent Yahoo daily session dates; no strategy performance used
  prior_inputs_excluded: Old signals, optimized parameters, synthetic price caches and performance reports
  feature_warmup_start: '1999-11-01'
  price_vintage: Retrospective vendor cache, not point-in-time quotes
  accounting_clock: '16:00 America/New_York on each source session date'
  clock_limitation: Daily accounting convention, not verified early-close or live signal availability
policy:
  signal: Causal QQQ total-return index strictly above its trailing completed-session simple moving average
  ma_sessions: [50, 100, 200]
  allocations: [0.3333333333333333, 0.6666666666666666, 1.0]
  candidate_count: 9
  product_leverage: 3.0
  synthetic_reset: Each completed daily observation
  allocation_mode: on_target_change_only_with_drift
  execution_delay_sessions: 1
  first_decision: First in-segment close; no inherited pending order
  account_reset: Flat cash at each segment; earlier observations are features only
  initial_cash: 1000.0
selection:
  stage: validation_only
  layer: expense
  objective: Pooled validation daily cash-excess Sharpe, sample standard deviation and sqrt(252)
  tie_tolerance: 0.0000000001
  tie_break: Lower allocation, then longer moving-average window, then stable candidate ID
  drawdown_screen: null
  undefined_score: Exclude and report undefined candidates; fail if no finite candidate
  development_results: Diagnostics only; do not change the candidate grid or selection rule
costs:
  fee_bps: 1.0
  slippage_bps: 5.0
  financing_spread_bps: 50.0
  expense_ratio: 0.0095
  extra_drag: 0.0050
  short_tax_rate: 0.24
  long_tax_rate: 0.15
  interest_tax_rate: 0.24
  wash_sales: true
  financing_day_count: 360.0
  expense_day_count: 365.0
  cash_day_count: 365.0
  cash_yield: Causal DTB3 investment-yield proxy, including negative observations
  rate_availability: Two US federal business days after observation at 18:00 New York
  rate_vintage: Latest-vintage FRED historical observations, not ALFRED point-in-time vintages
  max_rate_age_days: 10.0
  synthetic_underlying: QQQ raw-price total returns including distributions; QQQ fund economics already embedded
  synthetic_financing: Two units borrowed per unit of prior daily-reset NAV; charge DFF plus spread once
  qqq_dividend_cash: First source daily observation on ex-date; actual payment dates unavailable
  qqq_distribution_tax_character: Ordinary-income hypothetical scenario, not verified qualification
  synthetic_tax_scope: Hypothetical virtual fund-unit FIFO realizations, not actual TQQQ investor taxes
  terminal_convention: Full hypothetical liquidation with exit costs and outstanding modeled taxes
evaluation:
  primary_endpoint: Net pretax compounded return difference in percentage points, selected strategy minus QQQ buy-and-hold
  primary_layer: expense
  cost_layers: [gross, trading, financing, expense, tax]
  benchmarks: [qqq_buy_hold, cash, qqq200ma]
  benchmark_dividend_policy: Reinvest dated QQQ cash distributions at the same accounting close when invested; trading costs apply
  benchmark_rebalance_policy: Every-bar targets for full-weight QQQ controls implement dividend reinvestment; fractional synthetic candidates remain transition-only
  benchmark_entry: Independent next-session close following the first test-session close
  attribution: Same delayed target-allocation paths; share quantities and tax-funding sales can differ
  annualization_sessions: 252
  slippage_sensitivity_bps: [10.0, 20.0, 30.0]
  financing_spread_sensitivity_bps: [100.0, 200.0]
  retraining_during_test: false
  expand_grid_after_test: false
  interpretation: Historical diagnostic, not a live strategy or proof of a profitable edge
uncertainty:
  simulations_per_block: 5000
  seed: 42
  mean_block_sessions: [20, 60]
  method: Paired circular stationary resampling of selected-strategy and QQQ daily net returns
  boundaries: Remove observed initial-entry and terminal multipliers, then apply each exactly once per draw
  limitation: Conditional historical return uncertainty; no parameter reselection or strategy reexecution
