# Separate prospective paper contract; does not amend the live retrospective research protocol.
schema_version: 1
protocol_id: qqq_forward_paper_v1
contract_id: qqq_forward_paper_v1
classification: prospective_manual_paper_protocol_requires_final_freeze_and_future_observations
hypothesis: A fixed B5 policy can be executed and audited causally on future actual QQQ/TQQQ hourly observations;
  future net performance and operational failures will be recorded without retuning. No positive performance
  is assumed.
execution_version: fill_referenced_v1
forward_policy: fixed_b5
policy_spec:
  allocation_multiplier: 1.0
  name: b5
  kind: b5
  product_leverage: 3.0
  long_ma_days: 200
  short_ma_days: 20
  medium_ma_days: 50
  macd_fast_days: 12
  macd_slow_days: 24
  macd_signal_days: 9
  entry_confirm_bars: 2
  exit_confirm_bars: 3
  exit_buffer: 0.01
  bear_filter_slope_days: 30
  bear_filter_buffer: 0.01
  profit_lock_scheme: &id001
  - - 3.0
    - 0.75
  - - 4.0
    - 0.5
  q100_activation_gain: 1.1
  q100_trim_weight: 0.5
  peak_stop_drawdown: 0.4
  vol_window_days: 84
  vol_lookback_days: 126
  vol_trigger: 0.95
  vol_recover: 0.2
  vol_cap_effective: 1.0
  cooldown_trading_days: 5
  max_changes_per_session: 1
  delay_bars: 1
  use_bear_filter: true
  use_profit_lock: true
  use_qtrim: true
  use_peak_stop: true
refit_schedule: never
adaptive_candidate_selection: false
bars_per_day: 7
signal_symbol: QQQ
trade_symbol: TQQQ
provider: Yahoo Finance via yfinance
price_basis: unadjusted_auto_adjust_false_back_adjust_false_actions_true_prepost_false
initial_cash: 1000.0
initial_units: 0.0
fee_bps: 1.0
slippage_bps: 5.0
cash_mode: zero_cash_interest
