bar_semantics:
  timestamp: start
  timezone: America/New_York
  interval_minutes: 60
  last_bar_minutes: 30
  normal_session_bar_starts:
  - 09:30
  - '10:30'
  - '11:30'
  - '12:30'
  - '13:30'
  - '14:30'
  - '15:30'
  bar_end: min(bar_start_plus_60_minutes,verified_exchange_session_close)
  availability_lag_seconds: 0
  availability_rule: source_observed_at_at_or_after_bar_end_and_not_in_the_future
  require_observed_at_not_before_bar_end: true
  maximum_recording_age_seconds: 900
  include_extended_hours: false
  incomplete_bars: reject
  missing_duplicate_out_of_session_bars: reject_or_append_explicit_missed_observation_no_silent_fill
  early_close_sessions: only_the_scheduled_bars_including_final_30_minutes_no_padding
