  policy_state: new_ExecutionPolicyEngine_at_actual_holdout_trade_and_regime_state_reset
  features: causal_features_on_frozen_warmup_plus_completed_forward_bars_only
  warmup_pnl: prohibited_warmup_is_features_only
  first_decision: after_first_accepted_completed_holdout_bar
  first_fill: not_earlier_than_next_accepted_tradable_bar_close_after_order
  checkpoint: canonical_model_state_hash_and_contract_hash_bound_to_manifest_and_ledger_head
  manifest_binding: external_final_code_manifest_hash_in_initialization_and_event_headers_not_embedded_circularly_in_this_contract
execution:
