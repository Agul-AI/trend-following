schema_version: 2
study_id: qqq_oos_v2
classification: prospective_frozen_policy_simulation_not_live_execution
hypothesis: Test fixed B5 versus QQQ on genuinely future data, after declared investor
  costs; losing or inconclusive outcomes are valid research.
policy_spec:
  allocation_multiplier: 1.0
  name: b5
  kind: b5
  product_leverage: 3.0
  long_ma_days: 200
  short_ma_days: 20
  medium_ma_days: 50
  macd_fast_days: 12
  macd_slow_days: 24
  macd_signal_days: 9
  entry_confirm_bars: 2
  exit_confirm_bars: 3
  exit_buffer: 0.01
  bear_filter_slope_days: 30
  bear_filter_buffer: 0.01
  profit_lock_scheme:
  - - 3.0
    - 0.75
  - - 4.0
    - 0.5
  q100_activation_gain: 1.1
  q100_trim_weight: 0.5
  peak_stop_drawdown: 0.4
  vol_window_days: 84
  vol_lookback_days: 126
  vol_trigger: 0.95
  vol_recover: 0.2
  vol_cap_effective: 1.0
  cooldown_trading_days: 5
  max_changes_per_session: 1
  delay_bars: 1
  use_bear_filter: true
  use_profit_lock: true
  use_qtrim: true
  use_peak_stop: true
calendar: docs/research_validation/calendar/xnys_scheduled_sessions_20241001_20281010.csv
distribution_calendar: configs/qqq_oos_distribution_calendar_v2.csv
calibration:
  sessions: 252
  warmup: features_only
  refit: never
execution:
  initial_cash: 1000.0
  cash_yield: 0.0
  bars_per_normal_session: 7
  bars_per_early_close: 4
  benchmark_entry: second_completed_bar_independent_of_B5
costs:
  fee_bps: 1.0
  baseline_slippage_bps: 5.0
  sensitivity_slippage_bps:
  - 10.0
  - 20.0
  - 30.0
  tax_short_rate: 0.24
  tax_long_rate: 0.15
  tax_interest_rate: 0.24
  fund_costs: embedded_actual_TQQQ_no_duplicate_charge
evaluation:
  checkpoint_months:
  - 12
  - 24
  primary_months: 24
  endpoint: net_total_return_delta_percentage_points_scaled_B5_minus_QQQ
  cutoff: last_session_close_before_local_anniversary
  performance_peeking: no_retuning_no_early_success_stopping
bootstrap:
  simulations: 5000
  seed: 42
  primary_block_sessions: 20
  sensitivity_block_sessions: 60
data_contract:
  primary_provider: Yahoo Finance via yfinance
  provider_price_basis: request_end_split_adjusted_Close_auto_adjust_false_back_adjust_false
  normalization: restore_physical_share_quotes_using_known_effective_splits
  signal_basis: causal_cumulative_split_normalized_price_no_dividend_reinvestment
  action_availability: assumed_public_by_ex_date_not_live_observation
  dividend_cash_availability: 16:00_America_New_York_on_declared_pay_date
  missing_bars: fail_no_fill_no_day_deletion
  revision_policy: first_vintage_wins_report_overlap_revisions
  source_retention: archive_at_least_monthly_before_hourly_retention_expiry
  distribution_status: 2026_QQQ_primary_publisher_schedule_not_confirmed_cash_receipt
  future_reference_updates: separate_timestamped_reference_file_never_edit_frozen_historical_input
  fallback_provider: licensed_AlphaVantage_30min_cache_start_label_verified_by_nested_15min_closes
  fallback_trigger: whole_session_for_BOTH_symbols_if_either_Yahoo_session_is_incomplete
  fallback_price_restoration: intraday_adjusted_close_times_matching_daily_raw_close_div_daily_adjusted_close
  fallback_subbars: require_every_scheduled_30min_subbar_ignore_and_report_after_core_close_rows
frozen_code_paths:
- pyproject.toml
- src/trend_following/__init__.py
- src/trend_following/metrics.py
- src/trend_following/research_ledger.py
- src/trend_following/research_execution.py
- src/trend_following/research_rates.py
- src/trend_following/research_oos_accounting.py
- src/trend_following/research_oos_data.py
- src/trend_following/research_oos_evaluation.py
- src/trend_following/research_oos_protocol.py
- scripts/run_qqq_oos_study.py
- tests/test_research_oos_accounting.py
- tests/test_research_oos_data.py
- tests/test_research_oos_evaluation.py
- tests/test_research_oos_protocol.py
- docs/research_validation/calendar/xnys_scheduled_sessions_20241001_20281010.metadata.json
- configs/qqq_oos_distribution_calendar_v2.metadata.json
- configs/qqq_oos_fallback_semantics_v2.json
- docs/research_validation/out_of_sample_study_design.md
change_control: Any code, policy, data-convention or primary-outcome change requires
  a new version and future freeze; preserve old records.
interpretation:
  research_success: valid_protocol_complete_auditable_data_reproducible_reporting_even_if_losing
  provisional_performance_support: positive_net_delta_AND_scaled_B5_max_drawdown_no_worse_than_QQQ
  uncertainty: conditional_interval_spanning_zero_is_inconclusive_no_edge_or_deployment_claim
  changes: new_experiment_preserve_original_no_restart_to_hide_losses
secondary_financing_model:
  spreads_above_DFF_bps:
  - 0
  - 50
  - 100
  - 200
  fund_expense_annual_assumption: 0.0095
  extra_tracking_drag_annual_assumption: 0.005
  api_combined_expense_ratio: 0.0145
  underlying: independently_causal_QQQ_total_return_index_not_actual_TQQQ
  rate_input: timestamp_available_DFF_ACT360_no_zero_substitution
  leverage: 3.0
  reset: verified_daily_session_close
  interpretation: hypothetical_price_counterfactual_not_isolated_measured_TQQQ_financing_or_primary_strategy_result
  availability: no_empirical_financing_output_until_underlying_and_causal_rate_inputs_supplied
