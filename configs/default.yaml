project:
  name: trend-following-real-data

data:
  source: yfinance
  tickers: [SPY, UPRO, QQQ, TQQQ, IWM, URTY, TLT, TMF, GLD, EFA, EEM, EDC, VNQ, DRN]
  # Requested start; effective start depends on data availability.
  # For QQQ-like history before actual QQQ, use documented Nasdaq-100 proxy data, not overwritten QQQ.
  start_date: "1990-01-01"
  end_date: null
  interval: 1d
  raw_dir: data/raw
  processed_dir: data/processed
  alignment: inner
  suspicious_gap_days: 7

backtest:
  initial_capital: 1.0
  transaction_cost_bps: 1.0
  slippage_bps: 1.0
  annualization: 252
  return_convention: close_to_close
  execution_delay_days: 1
  max_trades_per_day: 1
  portfolio_mode: equal_sleeves
  train_end_date: "2018-12-31"

strategies:
  sma_trend:
    window: 200
  sma_crossover:
    short_window: 50
    long_window: 200
  tsmom:
    lookback: 252
  donchian_breakout:
    entry_lookback: 252
    exit_lookback: 126
  regression_slope:
    window: 126
    min_r_squared: 0.0
  kalman_trend:
    process_level_var: 0.00001
    process_trend_var: 0.0000001
    observation_var: 0.001
    min_periods: 20
  cross_sectional_momentum:
    lookback: 126
    top_n: 3
    require_positive: true
    portfolio_mode: active_equal
  regime_switch:
    target_ticker: QQQ
    regime_ticker: QQQ
    sma_window: 200
    sma_slope_window: 20
    variance_window: 63
    variance_horizon: 5
    use_variance_ratio_for_trend: false
    trend_variance_ratio_threshold: 1.05
    mean_reversion_variance_ratio_threshold: 0.98
    volatility_window: 20
    volatility_percentile_window: 252
    volatility_percentile_threshold: 0.80
    zscore_window: 20
    entry_zscore: -1.5
    exit_zscore: 0.0
    trend_short_window: 50
    trend_long_window: 200
  volatility_targeting:
    enabled: false
    target_vol: 0.10
    lookback: 63
    max_leverage: 1.0

experiments:
  sma_windows: [50, 100, 150, 200, 250]
  tsmom_lookbacks: [63, 126, 189, 252]
  crossover_short_windows: [20, 50, 100]
  crossover_long_windows: [100, 150, 200, 250]
  breakout_entry_lookbacks: [63, 126, 252]
  breakout_exit_lookbacks: [21, 63, 126]
  regression_windows: [63, 126, 189, 252]
  cross_sectional_lookbacks: [63, 126, 252]
  cross_sectional_top_ns: [2, 3, 5]

reports:
  figures_dir: reports/figures
  tables_dir: reports/tables
  summary_path: reports/summary.md
